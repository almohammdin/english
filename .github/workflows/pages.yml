name: Publish Harjah
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and lesson data
        run: |
          node --check app.js
          node --check coach.js
          node --check coach-data.js
          node --check exams.js
          node --check curriculum.js
          node --check server.mjs
          node tests/content.test.cjs
          node tests/coach.test.cjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare public files
        run: |
          mkdir -p public
          cp index.html style.css data.js curriculum.js coach-data.js exams.js coach.js app.js icon.svg social.png font.woff2 bold.woff2 public/
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
